<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#46418F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thông tin thuốc">
<title>Thông tin thuốc</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --paper:#F0EFF5; --card:#FFFFFF; --ink:#181630; --ink2:#5F5C7A; --ink3:#8C89A6;
  --rule:#DEDCE8; --accent:#46418F; --accent-soft:#E5E3F2; --flag:#8A4A1B; --flag-soft:#F7EBDD;
  --ok:#2C6E49; --ok-soft:#DEEEE5; --alert:#9B2C2C; --alert-soft:#FBE9E9;
  --shadow:0 1px 2px rgba(24,22,48,.06),0 4px 14px rgba(24,22,48,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
[data-theme="dark"]{
  --paper:#0E0D16; --card:#1A1826; --ink:#E9E7F2; --ink2:#9E9BB4; --ink3:#736F8C;
  --rule:#2C2940; --accent:#9D97E0; --accent-soft:#221F3A; --flag:#D9A05E; --flag-soft:#2C2317;
  --ok:#7FC0A0; --ok-soft:#172B22; --alert:#E58C8C; --alert-soft:#2E1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-bottom:30px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:40;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--rule)}
.brandrow{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.brand{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0}
.brand em{font-style:normal;color:var(--accent)}
.sub{font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin-left:auto}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:8px;width:30px;height:30px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink2);font-size:14px;flex:none}
.tabs{display:flex;gap:4px;background:var(--rule);padding:3px;border-radius:10px;margin-bottom:9px}
.tab{flex:1;padding:7px 10px;border:none;background:none;border-radius:7px;font-size:13.5px;
  font-weight:600;color:var(--ink2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.searchwrap{position:relative;margin-bottom:8px}
#q{width:100%;padding:11px 34px 11px 13px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);font-size:16px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;
  color:var(--ink3);font-size:17px;width:28px;height:28px;cursor:pointer;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:99px;border:1px solid var(--rule);background:var(--card);
  font-size:12.5px;color:var(--ink2);white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.notice{margin:12px 12px 0;padding:10px 12px;border-radius:9px;background:var(--flag-soft);
  color:var(--flag);font-size:11.5px;line-height:1.5}
main{padding:10px 12px 0}
.count{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.05em;
  text-transform:uppercase;margin:2px 2px 9px}
.gdiv{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-family:var(--mono);
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.gdiv::after{content:"";flex:1;height:1px;background:var(--rule)}
.gdiv .dot{width:7px;height:7px;border-radius:2px;flex:none}

.card{background:var(--card);border-radius:11px;margin-bottom:7px;box-shadow:var(--shadow);
  overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--band)}
.head{width:100%;text-align:left;background:none;border:none;padding:11px 13px 11px 16px;cursor:pointer;display:block}
.titleline{display:flex;align-items:baseline;gap:7px}
.name{font-size:15.5px;font-weight:650;flex:1;min-width:0}
.name mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
.metaline{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.grp{font-size:11.5px;color:var(--ink3)}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;padding:1.5px 5px;border-radius:4px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--rule);color:var(--ink2)}
.pill.empty{background:none;color:var(--ink3);border:1px dashed var(--rule)}

.body{padding:0 13px 13px 16px;border-top:1px solid var(--rule);margin-top:2px}
.body[hidden]{display:none}
.fld{margin-top:12px}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:4px}
.val{white-space:pre-line;font-size:14px;line-height:1.6}
.src{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:12px;
  padding-top:9px;border-top:1px solid var(--rule);white-space:pre-line}
.srclink{display:inline-block;margin-top:4px;color:var(--accent);font-weight:600;
  font-size:12px;text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.xlink{display:block;margin-top:13px;padding:11px;border-radius:9px;background:var(--accent-soft);
  color:var(--accent);text-align:center;font-size:13px;font-weight:650;text-decoration:none}
.nodata{font-size:13px;color:var(--ink3);padding:12px 0;line-height:1.5}
.empty{text-align:center;padding:44px 20px;color:var(--ink2);font-size:13.5px}
footer{padding:24px 16px 8px;font-size:11px;color:var(--ink3);line-height:1.6;text-align:center}

.alertbox{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--alert-soft);
  color:var(--alert);font-size:13.5px;line-height:1.6;white-space:pre-line}
.bacrow{display:flex;gap:5px;margin-top:13px;overflow-x:auto;scrollbar-width:none}
.bacrow::-webkit-scrollbar{display:none}
.bacbtn{flex:none;padding:7px 11px;border-radius:8px;border:1px solid var(--rule);background:var(--card);
  cursor:pointer;text-align:left;line-height:1.25}
.bacbtn b{display:block;font-size:12.5px;font-weight:650}
.bacbtn span{display:block;font-size:10px;color:var(--ink3);font-family:var(--mono);margin-top:1px}
.bacbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.bacbtn[aria-pressed="true"] span{color:rgba(255,255,255,.75)}
.fold{width:100%;text-align:left;background:none;border:1px solid var(--rule);border-radius:9px;
  padding:9px 11px;margin-top:12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);
  display:flex;align-items:center;gap:7px}
.fold::after{content:"▾";margin-left:auto;color:var(--ink3);font-size:11px}
.fold[aria-expanded="true"]::after{content:"▴"}
.foldbody{font-size:14px;line-height:1.65;white-space:pre-line;padding:10px 2px 2px;color:var(--ink2)}
.foldbody[hidden]{display:none}

.dcard{border:1px solid var(--rule);border-radius:10px;padding:11px 12px;margin-top:8px}
.dtop{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.dname{font-size:15px;font-weight:650}
.drole{font-size:11.5px;color:var(--ink3)}
.dtime{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:3px}
.ddose{font-size:14px;line-height:1.6;white-space:pre-line;margin-top:7px}
.dwhy{margin-top:9px;padding:8px 10px;border-left:2.5px solid var(--accent);background:var(--accent-soft);
  border-radius:0 6px 6px 0}
.dwhy b{display:block;font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:3px}
.dwhy p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.dwarn{margin:8px 0 0;padding:0;list-style:none}
.dwarn li{font-size:13.5px;line-height:1.55;padding-left:18px;position:relative;margin-top:6px;color:var(--ink2)}
.dwarn li::before{content:"!";position:absolute;left:0;top:3px;width:13px;height:13px;border-radius:3px;
  background:var(--flag-soft);color:var(--flag);font-size:9.5px;font-weight:700;
  display:grid;place-items:center}
.dlink{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--accent);font-weight:600;
  cursor:pointer;background:none;border:none;border-bottom:1px solid var(--accent-soft);padding:0 0 1px}

.chk{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 0 8px 25px;
  position:relative;cursor:pointer;font-size:14px;line-height:1.5;border-bottom:1px solid var(--rule)}
.chk::before{content:"";position:absolute;left:0;top:10px;width:15px;height:15px;border-radius:4px;
  border:1.5px solid var(--ink3)}
.chk[aria-pressed="true"]{color:var(--ink3)}
.chk[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"]::after{content:"✓";position:absolute;left:3px;top:9px;color:#fff;font-size:11px;font-weight:700}
.chk small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}

.wbox{background:var(--card);border-radius:11px;box-shadow:var(--shadow);padding:11px 13px;margin-bottom:10px}
.wrow{display:flex;align-items:center;gap:9px}
.wrow label{font-size:13.5px;font-weight:600;flex:none}
#kg{width:82px;padding:8px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);font-size:16px;text-align:center}
#kg:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.whint{font-size:11.5px;color:var(--ink3);line-height:1.45;margin-top:7px}
.rfil{display:flex;gap:5px;margin-top:9px}
.rfil button{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);
  font-size:12px;color:var(--ink2);cursor:pointer}
.rfil button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tagct{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 6px;border-radius:4px;
  font-weight:700;background:var(--alert-soft);color:var(--alert);white-space:nowrap}
.tagpv{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 6px;border-radius:4px;
  font-weight:700;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.spec{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:4px}
.calc{margin-top:10px;padding:9px 11px;border-radius:9px;background:var(--accent-soft)}
.calc b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:4px}
.big{font-size:19px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.calcline{font-size:13.5px;color:var(--ink2);line-height:1.6}
.reflist{margin:0;padding:0;list-style:none}
.refitem{padding:10px 0;border-bottom:1px solid var(--rule)}
.refitem:last-child{border-bottom:none}
.reftag{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 5px;border-radius:4px;
  font-weight:700;margin-right:6px;white-space:nowrap}
.reftag.byt{background:var(--ok-soft);color:var(--ok)}
.reftag.bv{background:var(--accent-soft);color:var(--accent)}
.reftag.qt{background:var(--rule);color:var(--ink2)}
.refname{font-size:13.5px;line-height:1.55}
.refdet{font-size:12px;color:var(--ink3);line-height:1.45;margin-top:3px}
.refopen{display:inline-block;margin-top:5px;font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <h1 class="brand">Thông tin <em>thuốc</em></h1>
    <span class="sub" id="ver"></span>
    <button class="iconbtn" id="theme" aria-label="Đổi nền sáng/tối">◐</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-thuoc" role="tab" aria-selected="true">Thuốc</button>
    <button class="tab" id="tab-chude" role="tab" aria-selected="false">Chủ đề</button>
    <button class="tab" id="tab-dt" role="tab" aria-selected="false">Dịch truyền</button>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Tìm thuốc, nhóm, chỉ định…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="clear" aria-label="Xoá tìm kiếm">×</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="notice" id="notice"></div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<footer>
  Biên soạn nội bộ khoa Dược — Bệnh viện Đại học Phenikaa.<br>
  <span id="verfoot"></span>
</footer>

<script src="./data.js"></script>
<script src="./chu-de.js"></script>
<script src="./dich-truyen.js"></script>
<script>

const BAND={"Tetracyclin":"#7B5EA7","Penicillin":"#2F7D9E","Cephalosporin":"#0E7C6B","Monobactam":"#6B7A8F",
"Carbapenem":"#B0483C","Sulfonamid":"#8A6D3B","Macrolid":"#4A7C3F","Aminoglycosid":"#A8622A",
"Quinolon":"#9B4568","Kháng khuẩn khác":"#3F5E8C","Kháng nấm":"#6E8C1F"};
const PALETTE=["#7B5EA7","#2F7D9E","#0E7C6B","#6B7A8F","#B0483C","#8A6D3B","#4A7C3F","#A8622A","#9B4568","#3F5E8C","#6E8C1F"];
function bandOf(c){
  if(BAND[c]) return BAND[c];
  let h=0; for(const ch of String(c||"")) h=(h*31+ch.charCodeAt(0))>>>0;
  return PALETTE[h%PALETTE.length];
}
/* Nhóm dược lý — dùng cho dải chip lọc. Thứ tự cố định, nhóm nào chưa có thuốc thì không hiện. */
const HE_ORDER=["Kháng khuẩn","Kháng nấm, kháng virus","Tim mạch","Máu và đông máu",
"Nội tiết, đái tháo đường","Thần kinh, tâm thần","Giảm đau, chống viêm","Tiêu hóa","Hô hấp",
"Cơ xương khớp","Tiết niệu, sinh dục","Dịch truyền, điện giải","Khác"];
const heOf=d=>d.he||"Khác";
const HAVE=new Set(INFO.map(heOf));
const CLASSES=HE_ORDER.filter(h=>HAVE.has(h)).concat([...HAVE].filter(h=>!HE_ORDER.includes(h)));
const FIELDS=[["coche","Cơ chế tác dụng"],["chidinh","Chỉ định"],["chongchidinh","Chống chỉ định"],["lieu","Liều dùng"],
["gan","Suy giảm chức năng gan"],["than","Suy giảm chức năng thận"],["luuy","Lưu ý, tác dụng không mong muốn"],
["tuongtac","Tương tác đáng chú ý"],["pha","Pha và truyền"]];

const TOPICS = (typeof CHUDE!=="undefined") ? CHUDE : [];
const TVER   = (typeof CHUDE_VERSION!=="undefined") ? CHUDE_VERSION : "";
const TGROUPS = [...new Set(TOPICS.map(t=>t.nhom))];
const REFTAG = {BYT:["byt","BỘ Y TẾ"], BV:["bv","BỆNH VIỆN"], QT:["qt","QUỐC TẾ"]};
const REFORDER = {BYT:0, BV:1, QT:2};

const PRODS = (typeof DICHTRUYEN!=="undefined") ? DICHTRUYEN : [];
const DTVER  = (typeof DT_VERSION!=="undefined") ? DT_VERSION : "";
const DTGROUPS = [...new Set(PRODS.map(p=>p.nhom))];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const store={g(k){try{return localStorage.getItem(k)}catch(e){return null}},
             s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function norm(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d").replace(/y/g,"i")
    .split(/[^a-z0-9]+/).map(w=>w.length>3?w.replace(/e$/,""):w).join(" ").trim();
}
INFO.forEach(d=>{ d._k=norm([d.ten,d.nhom,d.cls,heOf(d),...FIELDS.map(f=>d[f[0]])].join(" ")); });
const filled=d=>FIELDS.some(f=>String(d[f[0]]||"").trim());

const DRUGMAP=new Map();
INFO.forEach(d=>{
  DRUGMAP.set(norm(d.ten), d.ten);
  const base=String(d.ten).split(/[—–]/)[0].trim();
  if(base && !DRUGMAP.has(norm(base))) DRUGMAP.set(norm(base), d.ten);
});
const findDrug=n=>DRUGMAP.get(norm(n))||null;

TOPICS.forEach(t=>{
  t._k=norm([t.ten,t.nhom,t.tukhoa,t.nguong,t.coche,
    (t.thuoc||[]).map(x=>x.ten+" "+(x.vaitro||"")).join(" "),
    (t.radon||[]).map(x=>x.ten).join(" ")].join(" "));
});
const tFilled=t=>(t.thuoc||[]).length>0;

PRODS.forEach(p=>{ p._k=norm([p.ten,p.nhom,p.hoatchat,p.nongdo,p.hang,p.dang].join(" ")); });

/* Số thập phân kiểu Việt Nam, bỏ số 0 thừa. */
const num=n=>(Math.round(n*10)/10).toString().replace(".",",");
/* Đổi số giờ thành "6 giờ 40 phút". */
function dur(h){
  if(!isFinite(h)||h<=0) return "";
  const t=Math.round(h*60), g=Math.floor(t/60), p=t%60;
  if(g===0) return p+" phút";
  return g+" giờ"+(p?" "+p+" phút":"");
}
/* Trả về khoảng mL/giờ cho một chế phẩm, theo cân nặng nếu cần. */
function mlh(p,w){
  const r=p.rate; if(!r) return null;
  if(r.kieu==="kg"){ if(!w) return null;
    return {kc:r.kc?r.kc*w:null, min:r.min?r.min*w:null, max:r.max*w, canW:true}; }
  if(r.kieu==="gio") return {kc:null, min:r.min||null, max:r.max, canW:false};
  if(r.kieu==="phut") return {kc:null, min:r.min*60, max:r.max*60, canW:false};
  return null;
}

let state={mode:"thuoc",q:"",cls:null,kg:"",duong:null,open:new Set(),
           openT:new Set(),bac:{},fold:new Set(),tick:new Set()};

$("ver").textContent=DATA_VERSION;
$("verfoot").textContent="Bản nội dung "+DATA_VERSION+(TVER?" · chủ đề "+TVER:"")+(DTVER?" · dịch truyền "+DTVER:"");

function setMode(m){
  state.mode=m; state.q=""; $("q").value=""; $("clear").style.display="none"; state.cls=null;
  ["thuoc","chude","dt"].forEach(k=>$("tab-"+({thuoc:"thuoc",chude:"chude",dt:"dt"})[k])
    .setAttribute("aria-selected",m===k));
  $("q").placeholder = m==="thuoc" ? "Tìm thuốc, nhóm, chỉ định…"
    : m==="chude" ? "Tìm chủ đề, vấn đề lâm sàng…" : "Tìm chế phẩm, hoạt chất…";
  const chung='Tài liệu tham khảo nội bộ, <b>không phải văn bản đã ban hành</b> và không dùng làm căn cứ kê đơn. ';
  $("notice").innerHTML = m==="thuoc"
    ? chung+"Liều dùng và hiệu chỉnh liều theo chức năng thận tra ở ứng dụng Liều kháng sinh."
    : m==="chude" ? chung+"Đối chiếu tài liệu gốc ở cuối mỗi chủ đề trước khi can thiệp."
    : chung+"Tốc độ mL/giờ do ứng dụng tự tính, luôn đối chiếu tờ hướng dẫn của chế phẩm trước khi cài bơm.";
  buildChips(); render();
}
$("tab-thuoc").addEventListener("click",()=>setMode("thuoc"));
$("tab-chude").addEventListener("click",()=>setMode("chude"));
$("tab-dt").addEventListener("click",()=>setMode("dt"));

function buildChips(){
  const items = state.mode==="thuoc" ? CLASSES : state.mode==="chude" ? TGROUPS : DTGROUPS;
  $("chips").innerHTML='<button class="chip" data-c="" aria-pressed="true">Tất cả</button>'
    +items.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join("");
}
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  state.cls=b.dataset.c||null;
  $("chips").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render();
});

/* URL viết trong trường Nguồn tự thành nút bấm, hiện tên miền cho gọn. */
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g,u=>{
    const raw=u.replace(/&amp;/g,"&"); let host;
    try{ host=new URL(raw).hostname.replace(/^www\./,"") }catch(e){ return u }
    return `<a class="srclink" href="${u}" target="_blank" rel="noopener">${esc(host)} →</a>`;
  });
}
function hl(name,q){
  if(!q) return esc(name);
  const i=name.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(name);
  return esc(name.slice(0,i))+"<mark>"+esc(name.slice(i,i+q.length))+"</mark>"+esc(name.slice(i+q.length));
}

function renderThuoc(){
  const nq=norm(state.q);
  const rows=INFO.filter(d=>(!state.cls||heOf(d)===state.cls)
    && (!nq||nq.split(" ").every(w=>d._k.includes(w))));
  $("count").textContent=`${rows.length} thuốc · ${INFO.filter(filled).length}/${INFO.length} đã có nội dung`;
  if(!rows.length){ $("list").innerHTML='<div class="empty">Không có kết quả.</div>'; return }

  let html="",last=null;
  const grouped=!nq;
  rows.forEach(d=>{
    if(grouped&&d.nhom!==last){ last=d.nhom;
      html+=`<div class="gdiv"><span class="dot" style="background:${bandOf(d.cls)}"></span>${esc(d.nhom)}</div>`; }
    const open=state.open.has(d.ten), has=filled(d);
    const pill = !has ? '<span class="pill empty">CHƯA CÓ NỘI DUNG</span>'
      : d.soat ? '<span class="pill ok">ĐÃ SOÁT</span>' : '<span class="pill no">CHƯA SOÁT</span>';
    html+=`<article class="card" id="d-${encodeURIComponent(d.ten)}" style="--band:${bandOf(d.cls)}">
      <button class="head" data-n="${esc(d.ten)}" aria-expanded="${open}">
        <div class="titleline"><span class="name">${hl(d.ten,state.q)}</span></div>
        <div class="metaline"><span class="grp">${esc(d.nhom)}</span>${pill}</div>
      </button>
      <div class="body" ${open?"":"hidden"}>
        ${has?FIELDS.filter(f=>String(d[f[0]]||"").trim())
            .map(f=>`<div class="fld"><div class="lbl">${f[1]}</div><div class="val">${esc(d[f[0]])}</div></div>`).join("")
          :'<div class="nodata">Chưa biên soạn nội dung cho thuốc này.</div>'}
        ${d.nguon?`<div class="src">Nguồn: ${linkify(d.nguon)}</div>`:""}
        ${d.xemlieu===false?"":`<a class="xlink" href="${LINK_LIEU}#${encodeURIComponent(d.ten)}" target="_blank" rel="noopener">
          Xem liều và hiệu chỉnh thận theo Quyết định →</a>`}
      </div></article>`;
  });
  $("list").innerHTML=html;
}

function drugBlock(x){
  const hit=findDrug(x.ten);
  const time=[x.khoiphat?"khởi phát "+x.khoiphat:"",x.keodai?"kéo dài "+x.keodai:""].filter(Boolean).join(" · ");
  return `<div class="dcard">
    <div class="dtop"><span class="dname">${esc(x.ten)}</span>
      ${x.vaitro?`<span class="drole">${esc(x.vaitro)}</span>`:""}</div>
    ${time?`<div class="dtime">${esc(time)}</div>`:""}
    ${x.lieu?`<div class="ddose">${esc(x.lieu)}</div>`:""}
    ${x.coche?`<div class="dwhy"><b>Vì sao</b><p>${esc(x.coche)}</p></div>`:""}
    ${(x.luuy||[]).length?`<ul class="dwarn">${x.luuy.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}
    ${hit?`<button class="dlink" data-go="${esc(hit)}">Thông tin thuốc: ${esc(hit)} →</button>`:""}
  </div>`;
}

function foldBlock(id,key,label,inner,plain){
  const k=id+"|"+key, fo=state.fold.has(k);
  return `<button class="fold" data-f="${esc(k)}" aria-expanded="${fo}">${esc(label)}</button>
    <div class="foldbody" ${fo?"":"hidden"}${plain?' style="white-space:normal"':""}>${inner}</div>`;
}

function renderChude(){
  if(!TOPICS.length){ $("count").textContent="";
    $("list").innerHTML='<div class="empty">Chưa có chủ đề nào.</div>'; return }
  const nq=norm(state.q);
  const rows=TOPICS.filter(t=>(!state.cls||t.nhom===state.cls)
    && (!nq||nq.split(" ").every(w=>t._k.includes(w))));
  $("count").textContent=`${rows.length} chủ đề · ${TOPICS.filter(t=>t.soat).length}/${TOPICS.length} đã soát`;
  if(!rows.length){ $("list").innerHTML='<div class="empty">Không có kết quả.</div>'; return }

  let html="",last=null;
  const grouped=!nq;
  rows.forEach(t=>{
    if(grouped&&t.nhom!==last){ last=t.nhom;
      html+=`<div class="gdiv"><span class="dot" style="background:${bandOf(t.nhom)}"></span>${esc(t.nhom)}</div>`; }
    const open=state.openT.has(t.id);
    const pill = !tFilled(t) ? '<span class="pill empty">CHƯA CÓ NỘI DUNG</span>'
      : t.soat ? '<span class="pill ok">ĐÃ SOÁT</span>' : '<span class="pill no">CHƯA SOÁT</span>';
    const sel=state.bac[t.id]||null;
    const list=(t.thuoc||[]).filter(x=>!sel||(x.bac||[]).includes(sel));

    let inner="";
    if(open){
      if(t.nguong) inner+=`<div class="alertbox">${esc(t.nguong)}</div>`;
      if((t.bac||[]).length){
        inner+=`<div class="bacrow"><button class="bacbtn" data-t="${esc(t.id)}" data-b="" aria-pressed="${!sel}"><b>Tất cả</b><span>&nbsp;</span></button>`
          +t.bac.map(b=>`<button class="bacbtn" data-t="${esc(t.id)}" data-b="${esc(b.ma)}" aria-pressed="${sel===b.ma}"><b>${esc(b.nhan)}</b><span>${esc(b.khoang)}</span></button>`).join("")
          +`</div>`;
      }
      if(t.coche) inner+=foldBlock(t.id,"coche","Cơ chế bệnh",esc(t.coche),false);
      if(list.length){
        const nhan=sel?(t.bac.find(b=>b.ma===sel)||{}).nhan||"":"";
        inner+=`<div class="fld"><div class="lbl">Thuốc xử trí${nhan?" — mức "+esc(nhan):""}</div></div>`
          +list.map(drugBlock).join("");
      } else if(sel){
        inner+=`<div class="nodata">Không có thuốc nào gắn cho mức này.</div>`;
      }
      if((t.radon||[]).length){
        inner+=foldBlock(t.id,"radon","Rà đơn — thuốc gây ra hoặc làm nặng thêm",
          t.radon.map((r,i)=>{const k=t.id+"|r"+i,on=state.tick.has(k);
            return `<button class="chk" data-tick="${esc(k)}" aria-pressed="${on}">${esc(r.ten)}${r.xuly?`<small>${esc(r.xuly)}</small>`:""}</button>`}).join(""),true);
      }
      if(t.theodoi) inner+=foldBlock(t.id,"td","Theo dõi",esc(t.theodoi),false);
      if((t.bay||[]).length){
        inner+=foldBlock(t.id,"bay","Bẫy hay gặp",
          `<ul class="dwarn" style="margin-top:0">${t.bay.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`,true);
      }
      if((t.tltk||[]).length){
        const sorted=[...t.tltk].sort((a,b)=>(REFORDER[a.loai]??9)-(REFORDER[b.loai]??9));
        inner+=foldBlock(t.id,"tl","Tài liệu tham khảo",
          `<ul class="reflist">${sorted.map(r=>{const tg=REFTAG[r.loai]||["qt",r.loai||"KHÁC"];
            return `<li class="refitem"><div class="refname"><span class="reftag ${tg[0]}">${esc(tg[1])}</span>${esc(r.ten)}</div>`
              +(r.chitiet?`<div class="refdet">${esc(r.chitiet)}</div>`:"")
              +(r.url?`<a class="refopen" href="${esc(r.url)}" target="_blank" rel="noopener">Mở tài liệu →</a>`:"")
              +`</li>`}).join("")}</ul>`,true);
      }
      if(t.ngaycapnhat) inner+=`<div class="src">Cập nhật ${esc(t.ngaycapnhat)}</div>`;
    }

    html+=`<article class="card" style="--band:${bandOf(t.nhom)}">
      <button class="head" data-t="${esc(t.id)}" aria-expanded="${open}">
        <div class="titleline"><span class="name">${hl(t.ten,state.q)}</span></div>
        <div class="metaline"><span class="grp">${esc(t.nhom)}</span>${pill}</div>
      </button>
      <div class="body" ${open?"":"hidden"}>${inner}</div></article>`;
  });
  $("list").innerHTML=html;
}

function prodCard(p){
  const w=parseFloat(String(state.kg).replace(",","."))||0;
  const r=mlh(p,w);
  const tag=p.duong==="trungtam"
    ? '<span class="tagct">TM TRUNG TÂM</span>'
    : '<span class="tagpv">NGOẠI VI ĐƯỢC</span>';
  let calc="";
  if(r){
    const rows=[];
    if(r.kc) rows.push(["Khuyến cáo",r.kc]);
    if(r.min&&!r.kc) rows.push(["Tối thiểu",r.min]);
    rows.push([r.min&&!r.kc?"Tối đa":"Tối đa",r.max]);
    const chinh=r.kc||r.max;
    const times=p.vols.map(v=>`${v} mL trong ${dur(v/r.max)}`).join(" · ");
    calc=`<div class="calc"><b>${r.canW?"Với "+num(w)+" kg":"Tốc độ đặt bơm"}</b>
      <div class="big">${num(chinh)}${r.kc?"":r.min?"–"+num(r.max):""} mL/giờ</div>
      <div class="calcline">${rows.map(x=>x[0]+" "+num(x[1])+" mL/giờ").join(" · ")}</div>
      <div class="calcline">Chạy hết ở tốc độ tối đa: ${times}</div></div>`;
  } else if(p.rate&&p.rate.kieu==="kg"){
    calc=`<div class="calc"><b>Cần cân nặng</b><div class="calcline">Nhập cân nặng ở trên để tính ra mL/giờ.</div></div>`;
  }
  return `<article class="card" style="--band:${bandOf(p.nhom)}">
    <div class="head" style="cursor:default">
      <div class="titleline"><span class="name">${hl(p.ten,state.q)}</span>${tag}</div>
      <div class="spec">${esc(p.dong)} · ${esc(p.nongdo)}${p.osm?" · "+esc(p.osm):""}</div>
      <div class="spec" style="color:var(--ink3)">${esc(p.hang)}</div>
    </div>
    <div class="body" style="border-top:1px solid var(--rule);padding-top:2px">
      <div class="fld"><div class="lbl">Tốc độ theo bản tin</div><div class="val">${esc(p.tocTxt)}</div></div>
      ${calc}
      ${p.thoigian?`<div class="fld"><div class="lbl">Thời gian truyền</div><div class="val">${esc(p.thoigian)}</div></div>`:""}
      ${(p.luuy||[]).length?`<ul class="dwarn">${p.luuy.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </div></article>`;
}

function renderDT(){
  if(!PRODS.length){ $("count").textContent="";
    $("list").innerHTML='<div class="empty">Chưa có dữ liệu dịch truyền.</div>'; return }
  const nq=norm(state.q);
  const rows=PRODS.filter(p=>(!state.cls||p.nhom===state.cls)
    && (!state.duong||(state.duong==="ngoaivi"?p.duong==="ngoaivi":p.duong==="trungtam"))
    && (!nq||nq.split(" ").every(w=>p._k.includes(w))));
  $("count").textContent=`${rows.length}/${PRODS.length} chế phẩm`;

  const w=state.kg;
  let html=`<div class="wbox">
    <div class="wrow"><label for="kg">Cân nặng</label>
      <input id="kg" type="number" inputmode="decimal" min="1" max="250" step="0.5"
        placeholder="kg" value="${esc(w)}"></div>
    <div class="rfil">
      <button data-d="" aria-pressed="${!state.duong}">Tất cả</button>
      <button data-d="ngoaivi" aria-pressed="${state.duong==="ngoaivi"}">Ngoại vi được</button>
      <button data-d="trungtam" aria-pressed="${state.duong==="trungtam"}">Bắt buộc trung tâm</button>
    </div>
    <div class="whint">Ứng dụng chỉ nhân tốc độ mL/kg/giờ với cân nặng. Không thay cho việc tính nhu cầu năng lượng và dịch của từng bệnh nhân.</div>
  </div>`;

  if(!rows.length){ $("list").innerHTML=html+'<div class="empty">Không có kết quả.</div>'; return }
  let last=null; const grouped=!nq;
  rows.forEach(p=>{
    if(grouped&&p.nhom!==last){ last=p.nhom;
      html+=`<div class="gdiv"><span class="dot" style="background:${bandOf(p.nhom)}"></span>${esc(p.nhom)}</div>`; }
    html+=prodCard(p);
  });
  $("list").innerHTML=html;
}

function render(){ state.mode==="thuoc"?renderThuoc():state.mode==="chude"?renderChude():renderDT(); }

$("list").addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");
  if(go){ const n=go.dataset.go; setMode("thuoc"); state.open.add(n); render();
    const el=document.getElementById("d-"+encodeURIComponent(n));
    if(el) el.scrollIntoView({block:"start",behavior:"smooth"});
    return; }
  const tick=e.target.closest("[data-tick]");
  if(tick){ const k=tick.dataset.tick;
    state.tick.has(k)?state.tick.delete(k):state.tick.add(k); render(); return; }
  const fold=e.target.closest("[data-f]");
  if(fold){ const k=fold.dataset.f;
    state.fold.has(k)?state.fold.delete(k):state.fold.add(k); render(); return; }
  const bac=e.target.closest(".bacbtn");
  if(bac){ state.bac[bac.dataset.t]=bac.dataset.b||null; render(); return; }
  const h=e.target.closest(".head"); if(!h) return;
  if(state.mode==="chude"){
    const id=h.dataset.t;
    state.openT.has(id)?state.openT.delete(id):state.openT.add(id);
  } else {
    const n=h.dataset.n;
    state.open.has(n)?state.open.delete(n):state.open.add(n);
  }
  render();
});
$("list").addEventListener("input",e=>{
  if(e.target.id==="kg"){ state.kg=e.target.value;
    const pos=e.target.selectionStart;
    renderDT();
    const el=$("kg"); if(el){ el.focus(); try{el.setSelectionRange(pos,pos)}catch(x){} }
  }
});
$("list").addEventListener("click",e=>{
  const d=e.target.closest("[data-d]");
  if(d&&state.mode==="dt"){ state.duong=d.dataset.d||null; renderDT(); }
});
$("q").addEventListener("input",e=>{
  state.q=e.target.value.trim();
  $("clear").style.display=state.q?"block":"none";
  render();
});
$("clear").addEventListener("click",()=>{$("q").value="";state.q="";$("clear").style.display="none";render();$("q").focus()});

const root=document.documentElement;
if(store.g("theme-tt")==="dark") root.dataset.theme="dark";
$("theme").addEventListener("click",()=>{
  const d=root.dataset.theme==="dark"?"light":"dark";
  root.dataset.theme=d; store.s("theme-tt",d);
});

setMode("thuoc");

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
  let r=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!r){r=true;location.reload()} });
}
</script>
